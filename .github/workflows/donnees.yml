name: Récupérer les chiffres Wikidata
on:
  push:
    paths: ['outils/wikidata.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  donnees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node outils/wikidata.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outils/brut
          git commit -m "Chiffres Wikidata bruts" || echo "rien à commiter"
          git push
